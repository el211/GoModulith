name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: gofmt -w .
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
